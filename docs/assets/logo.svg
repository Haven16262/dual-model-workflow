<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="720" height="150" role="img" aria-label="Two roles, an Overseer and a Worker, handing off through a shared Markdown file">
  <title>Dual-Model Workflow: Overseer and Worker handing off through a shared Markdown file</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="720" height="150" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <!-- Overseer -->
  <rect x="190" y="36" width="78" height="78" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="229" cy="75" r="17" fill="none" stroke="#2563eb" stroke-width="5"/>
  <!-- shared file -->
  <path d="M331 34h42l16 16v64a4 4 0 0 1-4 4h-54a4 4 0 0 1-4-4V38a4 4 0 0 1 4-4z" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M373 34v16h16" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M338 70h38M338 82h38M338 94h26" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
  <!-- Worker -->
  <rect x="452" y="36" width="78" height="78" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <path d="M470 62l-14 13 14 13M512 62l14 13-14 13M497 58l-10 34" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 0)"/>
  <!-- handoff arrows -->
  <path d="M274 64h48" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/>
  <path d="M322 88h-48" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/>
  <path d="M446 64h-48" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/>
  <path d="M398 88h48" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/>
</svg>
